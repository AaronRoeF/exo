<text x="788" y="97" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">BINDS</text>
<rect x="272" y="292" width="48" height="12" rx="2" fill="#F5F5F5"/>
<text x="296" y="301" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">INDEX</text>
