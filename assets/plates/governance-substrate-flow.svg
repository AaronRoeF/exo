<text x="240" y="215" fill="#1F2125" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">MUST EDIT THE RULE</text>

<rect x="72" y="80" width="192" height="76" rx="6" fill="#e2f7f1" stroke="#10BA87" stroke-width="1.4"/>
<text x="168" y="112" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">Rule files</text>
<text x="168" y="132" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">149 · one per rule</text>

<rect x="320" y="80" width="192" height="76" rx="6" fill="#ffffff" stroke="#1F2125" stroke-width="1.2"/>
<text x="416" y="112" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">rules-loaded-check</text>
<text x="416" y="132" fill="#6E747C" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">SessionStart hook</text>

