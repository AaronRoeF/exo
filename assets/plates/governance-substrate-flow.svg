<text x="416" y="316" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">decision-log.md</text>
<text x="416" y="336" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">never injected at boot</text>

<line x1="72" y1="396" x2="1008" y2="396" stroke="#dddadb" stroke-width=".8"/>
<text x="72" y="416" fill="#6E747C" font-size="8" font-family="Montserrat,sans-serif" font-weight="600" letter-spacing=".18em">LEGEND</text>
