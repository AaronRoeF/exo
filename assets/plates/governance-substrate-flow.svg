<svg viewBox="0 0 1080 460" role="img" aria-labelledby="gov-t gov-d" xmlns="http://www.w3.org/2000/svg">
<title id="gov-t">Governance substrate flow</title>
<desc id="gov-d">Rule files are compiled by a boot hook into a regenerated index injected into session context; decision records sit on a lower track that is written but never loaded, linked only by a human obligation.</desc>
