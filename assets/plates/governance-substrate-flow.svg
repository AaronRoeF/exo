<text x="664" y="112" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">INDEX.md</text>
<text x="664" y="132" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">60 always-on · 89 triggered</text>

<rect x="816" y="80" width="192" height="76" rx="6" fill="#e2f7f1" stroke="#10BA87" stroke-width="1.4"/>
