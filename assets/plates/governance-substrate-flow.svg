<text x="186" y="417" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Loaded at boot — binds output</text>
<rect x="400" y="408" width="14" height="10" rx="2" fill="#f9f1e9" stroke="#A6834E" stroke-width="1.2"/>
<text x="422" y="417" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Recorded — never loaded</text>
<line x1="628" y1="413" x2="660" y2="413" stroke="#A6834E" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="668" y="417" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Human obligation, not automation</text>
</svg>
