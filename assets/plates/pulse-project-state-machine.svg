<svg viewBox="0 0 1080 440" role="img" aria-labelledby="pulse-t pulse-d" xmlns="http://www.w3.org/2000/svg">
<title id="pulse-t">PULSE project state machine</title>
<desc id="pulse-d">Projects move from idea to active to done, with blocked as an explicit recoverable state and stale as an automatic timed decay; there is no paused state.</desc>
<defs>
<marker id="a5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10BA87"/></marker>
<marker id="n5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4A5058"/></marker>
<marker id="s5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#A6834E"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F5F5F5"/>

<path d="M 240 108 L 312 108" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#n5)"/>
<path d="M 552 108 L 776 108" stroke="#10BA87" stroke-width="1.4" fill="none" marker-end="url(#a5)"/>
<path d="M 396 148 L 396 240" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#n5)"/>
<path d="M 468 240 L 468 148" stroke="#4A5058" stroke-width="1.2" fill="none" marker-end="url(#n5)"/>
<path d="M 664 240 L 664 148" stroke="#A6834E" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#s5)"/>
<path d="M 724 280 L 840 280 Q 848 280 848 272 L 848 148" stroke="#A6834E" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#s5)"/>

<rect x="244" y="80" width="64" height="12" rx="2" fill="#F5F5F5"/>
<text x="276" y="89" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">PICKED UP</text>
<rect x="616" y="80" width="96" height="12" rx="2" fill="#F5F5F5"/>
<text x="664" y="89" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">COMPLETION 100</text>
<rect x="300" y="184" width="76" height="12" rx="2" fill="#F5F5F5"/>
<text x="338" y="193" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">BLOCKER SET</text>
<rect x="484" y="184" width="64" height="12" rx="2" fill="#F5F5F5"/>
<text x="516" y="193" fill="#4A5058" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">RESOLVED</text>
<rect x="680" y="184" width="64" height="12" rx="2" fill="#F5F5F5"/>
<text x="712" y="193" fill="#1F2125" font-size="8" font-family="'Roboto Mono',monospace" text-anchor="middle" letter-spacing=".06em">21 DAYS</text>

<rect x="72" y="72" width="168" height="76" rx="6" fill="#f8f8f8" stroke="#4a5058" stroke-width="1.2"/>
<text x="156" y="104" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">idea</text>
<text x="156" y="124" fill="#6E747C" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">p3 · completion 0</text>

<rect x="312" y="72" width="240" height="76" rx="6" fill="#ffffff" stroke="#1F2125" stroke-width="1.2"/>
<text x="432" y="104" fill="#1F2125" font-size="13" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">active</text>
<text x="432" y="124" fill="#4A5058" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">focus lock · one at a time</text>

<rect x="776" y="72" width="232" height="76" rx="6" fill="#e2f7f1" stroke="#10BA87" stroke-width="1.4"/>
<text x="892" y="104" fill="#1F2125" font-size="13" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">done</text>
<text x="892" y="124" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">the point of the system</text>

<rect x="312" y="240" width="240" height="76" rx="6" fill="#f8f8f8" stroke="#4a5058" stroke-width="1.2"/>
<text x="432" y="272" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">blocked</text>
<text x="432" y="292" fill="#6E747C" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">health red · blocked_on named</text>

<rect x="584" y="240" width="240" height="76" rx="6" fill="#f9f1e9" stroke="#A6834E" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="704" y="272" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">stale</text>
<text x="704" y="292" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">automatic · health yellow</text>

<line x1="72" y1="368" x2="1008" y2="368" stroke="#dddadb" stroke-width=".8"/>
<text x="72" y="388" fill="#6E747C" font-size="8" font-family="Montserrat,sans-serif" font-weight="600" letter-spacing=".18em">LEGEND</text>
<rect x="164" y="380" width="14" height="10" rx="2" fill="#f8f8f8" stroke="#4a5058" stroke-width="1.2"/>
<text x="186" y="389" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Chosen state</text>
<rect x="308" y="380" width="14" height="10" rx="2" fill="#f9f1e9" stroke="#A6834E" stroke-width="1.2"/>
<text x="330" y="389" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Entered by decay, not decision</text>
<rect x="560" y="380" width="14" height="10" rx="2" fill="#e2f7f1" stroke="#10BA87" stroke-width="1.2"/>
<text x="582" y="389" fill="#4A5058" font-size="9" font-family="Roboto,sans-serif">Terminal — finished</text>
</svg>
