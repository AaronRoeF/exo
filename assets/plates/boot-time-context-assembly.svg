<text x="540" y="480" fill="#4A5058" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">60 rules inlined verbatim + 89 as a trigger table</text>
<text x="540" y="498" fill="#6E747C" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">survives compaction via post-compact-reload</text>

<rect x="328" y="560" width="424" height="76" rx="6" fill="#e2f7f1" stroke="#10BA87" stroke-width="1.4"/>
<text x="540" y="590" fill="#1F2125" font-size="12" font-weight="500" font-family="Roboto,sans-serif" text-anchor="middle">Ξ  the load canary</text>
<text x="540" y="612" fill="#1F2125" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">no sigil = personality never loaded = un-governed</text>
<text x="540" y="628" fill="#6E747C" font-size="9" font-family="'Roboto Mono',monospace" text-anchor="middle">defined ONLY in the personality file — cannot be faked from CLAUDE.md</text>

