<svg viewBox="0 0 1080 700" role="img" aria-labelledby="boot-t boot-d" xmlns="http://www.w3.org/2000/svg">
<title id="boot-t">Boot-time context assembly</title>
<desc id="boot-d">Three source families reach the session by two mechanisms: the CLAUDE.md chain is read natively by the harness, while personality and rules are injected as stdout by SessionStart hooks; a sigil canary distinguishes the two at runtime.</desc>
