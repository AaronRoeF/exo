<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="img" aria-labelledby="exo-systems-title exo-systems-desc">
  <title id="exo-systems-title">Exo systems: surfaces read and write one plain-text knowledge base</title>
  <desc id="exo-systems-desc">Systems diagram. You work through Claude Code or Claude Desktop; both read and write a plain-text knowledge base on your own disk. Observations accumulate as a side effect of work, a weekly review promotes what survives into the rules layer, and the rules feed back into every surface. exo-mesh supplies relationship context from a local replica of mail, calendar, iMessage and contacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5058"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10ba87"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="44" fill="#6e747c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">EXO · SYSTEMS</text>
  <text x="40" y="76" fill="#1f2125" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">The knowledge base is the system.</text>
  <text x="40" y="100" fill="#4a5058" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif">Surfaces come and go. Plain text on your own disk outlives every tool that reads it.</text>
