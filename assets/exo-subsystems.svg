<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600"
     role="img" aria-labelledby="exo-sub-title exo-sub-desc">
  <title id="exo-sub-title">Exo subsystems: four ways in, one place everything lands</title>
  <desc id="exo-sub-desc">Subsystem diagram. Thirteen skills, five slash commands and four hooks run inside Claude Code; an MCP server with eight tools serves other clients. All four write to the same plain-text knowledge base. exo-mesh is a separate subsystem, published as its own repository, that supplies relationship context from a local replica of mail, calendar, iMessage and contacts.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5058"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <text x="40" y="44" fill="#6e747c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">EXO · SUBSYSTEMS</text>
  <text x="40" y="76" fill="#1f2125" font-size="28" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">Four ways in. One place it all lands.</text>
  <text x="40" y="100" fill="#4a5058" font-size="12" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif">Each subsystem is replaceable. What they write to is not.</text>
  <line x1="140" y1="244" x2="140" y2="300" stroke="#4a5058" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="244" x2="340" y2="300" stroke="#4a5058" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="540" y1="244" x2="540" y2="300" stroke="#4a5058" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="740" y1="244" x2="740" y2="300" stroke="#4a5058" stroke-width="1" marker-end="url(#arrow)"/>
