  <text x="500" y="472" fill="#1f2125" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">exo-mesh</text>
  <text x="500" y="488" fill="#4a5058" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">mail · calendar · iMessage · contacts → one person</text>
  <text x="656" y="488" fill="#6e747c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">github.com/AaronRoeF/exo-mesh</text>
