  <text x="340" y="212" fill="#4a5058" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">daily · prep · weekly · wrap</text>
  <rect x="440" y="156" width="200" height="88" rx="6" fill="#ffffff"/>
  <rect x="440" y="156" width="200" height="88" rx="6" fill="#ffffff" stroke="#1f2125" stroke-width="1"/>
