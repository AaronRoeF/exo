  <text x="140" y="212" fill="#4a5058" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">health · imessage · vault</text>
  <rect x="240" y="156" width="200" height="88" rx="6" fill="#ffffff"/>
