  <text x="440" y="332" fill="#1f2125" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">~/Exo — plain-text knowledge base</text>
  <text x="440" y="352" fill="#4a5058" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">projects · people · accounts · decisions · intel · observations</text>
  <text x="440" y="372" fill="#4a5058" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">markdown on your own disk · the only thing here that compounds</text>
