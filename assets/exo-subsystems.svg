  <line x1="500" y1="444" x2="500" y2="404" stroke="#4a5058" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="510" y="414" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="528" y="423" fill="#6e747c" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">WHO</text>
